[package]
name = "kairosmonitor"
version = "0.4.0"
edition = "2024"
description = "Kairos telemetry in the macOS menu bar"

[dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "libc", "NSApplication", "NSWindow", "NSView", "NSTextField", "NSFont", "NSFontDescriptor", "NSColor", "NSButton", "NSControl", "NSStatusItem", "NSStatusBar", "NSStatusBarButton", "NSPopover", "NSViewController", "NSEvent", "NSAppearance", "NSGraphics", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSBezierPath", "NSParagraphStyle", "NSAttributedString", "NSStringDrawing", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSAccessibility", "NSAccessibilityProtocols", "NSCell", "NSButtonCell", "NSText", "NSMenuItem", "NSLayoutConstraint", "NSLayoutAnchor", "NSColorSpace", "objc2-quartz-core", "objc2-core-foundation", "objc2-core-graphics"
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["CALayer", "objc2-core-graphics"] }
objc2-foundation = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
