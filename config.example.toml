# Configuración de Kairos Monitor para Apple Silicon.
url = "http://kairos:8787/api/metrics"
dashboard = "http://kairos:8787/"
# Compatibilidad con versiones antiguas: los modelos se detectan automáticamente.
service = "auto"
interval = 5
openInterval = 2
timeout = 4
gpuWarn = 85
gpuDanger = 95
memWarn = 85
memDanger = 95
tempWarn = 78
tempDanger = 88
graph = true
showGpu = true
showMemory = true
showTps = true
# Fondo suave de la barra: none, blue, sage, lavender, sand, rose o gray.
barBackground = "none"
history = 44
# El inicio de sesión se gestiona en Ajustes y pertenece a este Mac.
# valueChars, fillAlpha, borderAlpha y border se aceptan por compatibilidad con v0.1,
# La barra reserva columnas fijas compactas y usa resaltado nativo.
# Paleta de X1 al portar el widget (acentos ajustados como Qt.lighter).
background = "#202229"
foreground = "#F2F3F7"
muted = "#8B909B"
green = "#33FF52"
yellow = "#FFCE65"
red = "#FF8D87"
